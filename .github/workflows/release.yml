name: Release plugin

# Push a version tag (e.g. v2.0.1) to build the plugin and publish a GitHub
# Release with the installable zip attached:
#   git tag v2.0.1 && git push origin v2.0.1

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin assets from the HTML source
        run: python files/edr-team-builder/build/assemble_builder.py

      - name: Stamp plugin version to match the tag
        run: |
          php=files/edr-team-builder/edr-team-builder.php
          sed -i "s/^\( \* Version: \).*/\1${{ steps.ver.outputs.v }}/" "$php"
          sed -i "s/define('EDR_TB_VER', '[^']*')/define('EDR_TB_VER', '${{ steps.ver.outputs.v }}')/" "$php"

      - name: Verify build output
        run: |
          js=files/edr-team-builder/assets/builder.js
          test -s "$js"
          test "$(wc -c < "$js")" -gt 20000
          grep -q 'const SAMPLE = \[\];' "$js"
          grep -q "state.tab==='setup'" "$js"

      # never cut a release from assets that do not match the HTML they claim to be built from
      # (scoped to assets/ because the version-stamp step above dirties the plugin PHP)
      - name: Committed assets match the HTML source
        run: |
          if ! git diff --exit-code -- files/edr-team-builder/assets; then
            echo "::error::assets are stale — run files/edr-team-builder/build/assemble_builder.py and commit before tagging"
            exit 1
          fi

      - name: Parse-check the generated bundle
        run: node --check files/edr-team-builder/assets/builder.js

      # 3.1.6: open the built bundle in headless Chrome (admin + driver, desktop + phone, Brisbane +
      # Sydney clocks) on the live site's public data and fail on any script error. Would have
      # caught 3.0.7's blank Availability tab. Data is fetched now, never committed (public repo).
      - name: Smoke test the bundle in Chrome
        run: |
          bash tests/smoke/fetch-fixtures.sh
          npm i --no-save --silent --prefix tests/smoke puppeteer-core@23
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tests/smoke/run.mjs

      - name: Package plugin zip
        env:
          EDR_ZIP: ${{ github.workspace }}/edr-team-builder-${{ steps.ver.outputs.v }}.zip
        run: python files/edr-team-builder/build/package_plugin.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EDR Team Builder ${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: edr-team-builder-${{ steps.ver.outputs.v }}.zip
          fail_on_unmatched_files: true
